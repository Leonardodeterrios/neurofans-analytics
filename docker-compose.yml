services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env          # BOT_TOKEN, BOT_USERNAME, ADMIN_CHAT_ID, DOMAIN, ...
    expose:
      - "8080"              # наружу не открыт: снаружи к приложению ходит только caddy
    volumes:
      - ./data:/app/data    # база переходов хранится на диске сервера

  lab:                      # кабинет учеников (lab./to.neurofans.ru) — своя база, трекер партнёров не трогает
    build:
      context: .
      dockerfile: students/Dockerfile
    restart: unless-stopped
    environment:
      ROOT_HOST: ${LAB_ROOT:-neurofans.ru}
      LAB_BOT_TOKEN: ${LAB_BOT_TOKEN:-}     # отдельный бот кабинета для уведомлений; пусто — выключены
    expose:
      - "8090"
    volumes:
      - ./lab-data:/app/data  # база кабинета, ключи и токен админки (admin_token.txt)

  caddy:                    # HTTPS-вход: 443 (домен) и 80 (http и старые ссылки на IP)
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}   # из .env; пока не задан — работает только http
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/data       # сертификаты, чтобы не получать их заново при перезапуске
