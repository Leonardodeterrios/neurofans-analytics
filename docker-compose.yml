services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env          # BOT_TOKEN, ADMIN_CHAT_ID, INGEST_TOKEN, ...
    ports:
      - "8080:8080"         # дашборд: http://СЕРВЕР:8080 ; приём: http://СЕРВЕР:8080/track
    volumes:
      - ./data:/app/data    # база переходов хранится на диске сервера
