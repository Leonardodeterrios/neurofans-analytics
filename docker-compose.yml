services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env          # BOT_TOKEN, ADMIN_CHAT_ID, ...
    volumes:
      - ./data:/app/data    # общая база переходов
  dashboard:
    build: .
    command: python dashboard.py
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"         # открой http://localhost:8080
    volumes:
      - ./data:/app/data    # тот же файл базы, что у бота
