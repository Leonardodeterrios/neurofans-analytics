services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env          # BOT_TOKEN, BOT_USERNAME, ADMIN_CHAT_ID, ...
    ports:
      - "80:8080"           # ссылка-считалка: http://СЕРВЕР/go?source=... ; дашборд: http://СЕРВЕР/
    volumes:
      - ./data:/app/data    # база переходов хранится на диске сервера
