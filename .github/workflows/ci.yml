name: CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Syntax check (compile all)
        run: python -m compileall -q neurofans_bot.py make_links.py
      - name: Smoke test link generator
        run: python make_links.py
