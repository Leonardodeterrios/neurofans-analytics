# Ретранслятор ИИ на зарубежном сервере (Timeweb Амстердам). Ставится install.sh.
services:
  relay:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "relay.mjs"]
    volumes: ["./relay.mjs:/app/relay.mjs:ro"]
    env_file: .env
    mem_limit: 256m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:-ai.neurofans.ru}
      GALLERY_DOMAIN: ${GALLERY_DOMAIN:-gallery.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/data
      - ../../gallery:/srv/gallery:ro
      - ../../static/fonts:/srv/fonts:ro
      - /opt/nf-gallery:/srv/gallery-data:ro
    depends_on: [relay]
